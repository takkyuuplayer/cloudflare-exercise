name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - labs/01-workers-intro
    defaults:
      run:
        working-directory: ${{ matrix.lab }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches `node = "lts"` in mise.toml.
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.lab }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
